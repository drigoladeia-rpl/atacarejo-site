<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto • ATACAREJO</title><style>
:root{--black:#151515;--orange:#ef5b3f;--cream:#f6f3ed;--line:#e6e1d8}*{box-sizing:border-box}body{margin:0;font-family:Arial;color:var(--black);background:#fff}header{padding:18px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:5}.logo{font-weight:950;font-size:24px}.logo b{color:var(--orange)}header a{text-decoration:none;color:inherit;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:38px 5% 70px}.back{display:inline-block;margin-bottom:25px;color:#666}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:42px}.main-photo{height:520px;background:#f5f3ef;border-radius:24px;overflow:hidden}.main-photo img{width:100%;height:100%;object-fit:cover}.thumbs{display:flex;gap:10px;overflow:auto;margin-top:12px}.thumb{width:78px;height:78px;border:2px solid transparent;border-radius:12px;overflow:hidden;padding:0;background:#eee;flex:0 0 auto}.thumb.active{border-color:var(--orange)}.thumb img{width:100%;height:100%;object-fit:cover}.tag{display:inline-block;background:var(--black);color:#fff;padding:7px 10px;border-radius:99px;font-size:11px;font-weight:900;text-transform:uppercase}.title{font-size:clamp(32px,5vw,55px);line-height:1;margin:12px 0}.pricebox{background:var(--cream);padding:18px;border-radius:16px;margin:22px 0}.price{font-size:31px;font-weight:950}.wholesale{margin-top:10px;color:var(--orange);font-weight:900}.meta{display:grid;gap:12px;margin:20px 0}.meta div{padding:14px;border:1px solid var(--line);border-radius:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:12px;padding:15px 19px;font-weight:900;cursor:pointer;text-decoration:none}.buy{background:var(--orange);color:#fff}.cart{background:var(--black);color:#fff}.outline{border:1px solid #ccc;background:#fff}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modal-card{background:#fff;border-radius:20px;padding:26px;max-width:420px;width:100%;text-align:center}.modal-card h2{margin-top:0}.modal-card button,.modal-card a{display:block;width:100%;margin:9px 0;text-align:center}.muted{color:#666;line-height:1.55}.error{padding:30px;text-align:center}
@media(max-width:800px){.layout{grid-template-columns:1fr}.main-photo{height:420px}}
</style></head><body><header><a class="logo" href="/"><b>ATA</b>CAREJO</a><a href="/carrinho.html">🛒 Carrinho</a></header><main class="wrap"><a class="back" href="/">← Voltar para a loja</a><div id="app"><div class="error">Carregando produto...</div></div></main><div id="modal" class="modal"><div class="modal-card"><h2>Produto adicionado! 🛍️</h2><p class="muted">O produto foi colocado no carrinho. O que você deseja fazer?</p><button class="btn outline" onclick="closeModal()">Continuar vendo outros produtos</button><a class="btn buy" href="/carrinho.html">Finalizar compra</a></div></div><script>
const id=new URLSearchParams(location.search).get('id');let product=null;const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){if(!id)throw Error('Produto não informado');const r=await fetch('/api/products/'+encodeURIComponent(id));const j=await r.json();if(!r.ok)throw Error(j.error||'Produto não encontrado');product=j;render()}
function render(){const imgs=product.images?.length?product.images:(product.image?[product.image]:[]);const first=imgs[0]||'';document.title=product.name+' • ATACAREJO';document.getElementById('app').innerHTML=`<div class="layout"><div><div class="main-photo" id="mainPhoto">${first?`<img src="${esc(first)}" alt="${esc(product.name)}">`:'<div class="error">Sem foto</div>'}</div><div class="thumbs">${imgs.map((u,i)=>`<button class="thumb ${i===0?'active':''}" onclick="showPhoto('${encodeURIComponent(u)}',this)"><img src="${esc(u)}" alt="Foto ${i+1}"></button>`).join('')}</div></div><section><span class="tag">${esc(product.type==='atacado'?'Atacado':'Varejo')}</span><h1 class="title">${esc(product.name)}</h1><div class="pricebox"><div class="price">${money(product.retail_price)}</div>${product.wholesale_price!=null?`<div class="wholesale">Atacado: ${money(product.wholesale_price)} • mínimo ${Number(product.wholesale_min||1)} un.</div>`:''}</div><div class="meta"><div><b>Descrição</b><br>${esc(product.description||'Produto selecionado do nosso catálogo.')}</div>${product.specifications?`<div><b>Especificações</b><br>${esc(product.specifications)}</div>`:''}${product.sizes?`<div><b>Tamanhos / grade</b><br>${esc(product.sizes)}</div>`:''}${product.colors?`<div><b>Cores / modelos</b><br>${esc(product.colors)}</div>`:''}${product.supplier?`<div><b>Fornecedor</b><br>${esc(product.supplier.name)} • origem ${esc(product.supplier.cep)}</div>`:''}</div><div class="actions"><button class="btn buy" onclick="addCart()">Comprar</button><a class="btn cart" href="/carrinho.html">Ver carrinho</a><a class="btn outline" href="/">Continuar comprando</a></div></section></div>`}
function showPhoto(encoded,btn){const u=decodeURIComponent(encoded);document.getElementById('mainPhoto').innerHTML=`<img src="${esc(u)}" alt="${esc(product.name)}">`;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function addCart(){const cart=JSON.parse(localStorage.getItem('atacarejo_cart')||'[]');const found=cart.find(x=>Number(x.product_id)===Number(product.id));if(found)found.quantity++;else cart.push({product_id:product.id,name:product.name,unit_price:Number(product.retail_price),quantity:1,image:product.images?.[0]||product.image||'',shipping_origin:product.shipping_origin,supplier_id:product.supplier_id});localStorage.setItem('atacarejo_cart',JSON.stringify(cart));document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
load().catch(e=>document.getElementById('app').innerHTML=`<div class="error"><h2>Não foi possível carregar</h2><p>${esc(e.message)}</p></div>`);
</script></body></html>
