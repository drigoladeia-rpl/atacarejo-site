<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produto | ATACAREJO</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f7f7;color:#111}.wrap{max-width:1000px;margin:auto;padding:25px}
.back{display:inline-block;margin-bottom:20px;text-decoration:none;color:#111;font-weight:700}.box{background:#fff;border-radius:22px;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:30px}.photo{min-height:380px;background:#f3f3f3;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.info h1{font-size:34px}.tag{display:inline-block;background:#111;color:#fff;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:800}.price{font-size:34px;font-weight:900;margin:18px 0}.stock{font-weight:700}.specs{line-height:1.7;white-space:pre-line}.buy{display:inline-block;background:#111;color:#fff;padding:14px 20px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:20px}@media(max-width:700px){.box{grid-template-columns:1fr}.photo{min-height:280px}}
</style></head><body><main class="wrap"><a class="back" href="index.html">← Voltar</a><div id="app">Carregando...</div></main>
<script>
(async()=>{const id=new URLSearchParams(location.search).get('id');const app=document.getElementById('app');try{
const p=await fetch('/api/products/'+encodeURIComponent(id)).then(r=>r.ok?r.json():Promise.reject());
const price=p.sale_price??(Number(p.factory_cost||0)*1.4);
app.innerHTML=`<div class="box"><div class="photo">${p.image?`<img src="${p.image}" alt="${p.name}">`:'Sem imagem'}</div><div class="info"><span class="tag">${p.type==='atacado'?'ATACADO':'VAREJO'}</span><h1>${p.name}</h1><p>${p.category||''}</p><div class="price">${price.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</div><p class="stock">${p.stock>0?p.stock+' unidades disponíveis':'Produto esgotado'}</p><div class="specs">${p.description||'Sem descrição cadastrada.'}</div><a class="buy" href="${p.whatsapp||'#'}">Comprar / falar no WhatsApp</a></div></div>`;
}catch(e){app.innerHTML='<h2>Produto não encontrado.</h2>'}})();
</script></body></html>
