<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração - ATACAREJO</title><style>body{font-family:Arial;margin:0;background:#f4f4f4;color:#111}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 12px;border:1px solid #ccc;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;background:#111;color:#fff;margin:4px;cursor:pointer}.danger{background:#b00020}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.hidden{display:none}.prod{display:flex;gap:12px;align-items:center;border-top:1px solid #ddd;padding:12px 0}.prod img{width:70px;height:70px;object-fit:cover;border-radius:8px}</style></head><body><div class="wrap"><h1>⚙️ Painel ATACAREJO</h1><div id="login" class="card"><h2>Entrar</h2><input id="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button onclick="login()">Entrar</button><p id="msg"></p></div><div id="panel" class="hidden"><div class="card"><button onclick="logout()">Sair</button><button onclick="newProduct()">+ Novo produto</button></div><div class="card"><h2>Produto</h2><form id="form"><input type="hidden" id="id"><label>Nome</label><input id="name" required><div class="grid"><div><label>Categoria</label><input id="category" placeholder="Calçados, Bolsas..."></div><div><label>Tipo</label><select id="type"><option value="varejo">Varejo</option><option value="atacado">Atacado</option></select></div></div><div class="grid"><div><label>Custo de fábrica</label><input id="cost" type="number" step="0.01"></div><div><label>Preço de venda</label><input id="price" type="number" step="0.01" placeholder="vazio = custo + 40%"></div></div><div class="grid"><div><label>Estoque</label><input id="stock" type="number"></div><div><label>Mínimo atacado</label><input id="min" type="number" value="1"></div></div><label>Foto</label><input id="image" type="file" accept="image/*"><label>Descrição</label><textarea id="description"></textarea><label>Especificações</label><textarea id="specs"></textarea><label>Tamanhos/grade</label><textarea id="sizes"></textarea><label>Cores/modelos</label><textarea id="colors"></textarea><button type="submit">Salvar produto</button></form></div><div class="card"><h2>Produtos cadastrados</h2><div id="list"></div></div><div class="card"><h2>Pedidos</h2><div id="orders">Carregando...</div></div></div></div><script>
const $=id=>document.getElementById(id); async function api(u,o){let r=await fetch(u,o);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Erro');return j}
async function check(){try{await api('/api/me');$('login').classList.add('hidden');$('panel').classList.remove('hidden');load()}catch{}} async function login(){try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});check()}catch(e){$('msg').textContent=e.message}} async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
function newProduct(){ $('form').reset();$('id').value='';$('min').value=1;window.scrollTo(0,0)}
$('form').onsubmit=async e=>{e.preventDefault();let fd=new FormData();['name','category','type'].forEach(x=>fd.append(x,$(x).value));fd.append('factory_cost',$('cost').value);fd.append('sale_price',$('price').value);fd.append('stock',$('stock').value);fd.append('wholesale_min',$('min').value);fd.append('description',$('description').value);fd.append('specifications',$('specs').value);fd.append('sizes',$('sizes').value);fd.append('colors',$('colors').value);if($('image').files[0])fd.append('image',$('image').files[0]);let id=$('id').value;try{await api(id?'/api/products/'+id:'/api/products',{method:id?'PUT':'POST',body:fd});alert('Salvo!');newProduct();load()}catch(e){alert(e.message)}};
async function load(){let p=await api('/api/admin/products');$('list').innerHTML=p.map(x=>`<div class="prod"><img src="${x.image||''}"><div style="flex:1"><b>${x.name}</b><br>${x.type} · R$ ${Number(x.sale_price??x.factory_cost*1.4).toFixed(2)} · estoque ${x.stock}</div><button onclick='edit(${JSON.stringify(x)})'>Editar</button><button class="danger" onclick='del(${x.id})'>Excluir</button></div>`).join('')||'Nenhum produto.'}
function edit(x){$('id').value=x.id;$('name').value=x.name;$('category').value=x.category;$('type').value=x.type;$('cost').value=x.factory_cost;$('price').value=x.sale_price??'';$('stock').value=x.stock;$('min').value=x.wholesale_min;$('description').value=x.description||'';$('specs').value=x.specifications||'';$('sizes').value=x.sizes||'';$('colors').value=x.colors||'';window.scrollTo(0,0)} async function del(id){if(confirm('Excluir este produto?')){await api('/api/products/'+id,{method:'DELETE'});load()}} async function orders(){try{let os=await api('/api/admin/orders');$('orders').innerHTML=os.map(o=>`<div class="prod"><div style="flex:1"><b>Pedido #${o.id}</b> — ${o.customer_name}<br>${o.customer_phone} · ${o.payment_method} · R$ ${Number(o.total).toFixed(2)}<br>Status: <select onchange="status(${o.id},this.value)"><option ${o.status==='recebido'?'selected':''}>recebido</option><option ${o.status==='confirmado'?'selected':''}>confirmado</option><option ${o.status==='pago'?'selected':''}>pago</option><option ${o.status==='enviado'?'selected':''}>enviado</option><option ${o.status==='concluido'?'selected':''}>concluido</option><option ${o.status==='cancelado'?'selected':''}>cancelado</option></select></div></div>`).join('')||'Nenhum pedido.'}catch(e){$('orders').textContent=e.message}}async function status(id,value){await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:value})});orders()}const oldLoad=load;load=async function(){await oldLoad();orders()};check();</script></body></html>
