<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel • ATACAREJO</title><style>
body{margin:0;font-family:Arial;background:#f5f3ef;color:#151515}.wrap{max-width:1150px;margin:auto;padding:24px 4%}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.card{background:#fff;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 8px 25px #0001}button{border:0;background:#151515;color:#fff;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.danger{background:#b00020}.secondary{background:#eee;color:#151515}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:800;font-size:13px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:9px;margin:5px 0 12px}.product,.supplier{display:flex;gap:14px;align-items:center;border-top:1px solid #eee;padding:13px 0}.product img{width:72px;height:72px;object-fit:cover;border-radius:10px;background:#eee}.grow{flex:1}.muted{color:#666;font-size:13px}.hidden{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-block;background:#151515;color:#fff;padding:5px 8px;border-radius:99px;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}.product,.supplier{align-items:flex-start;flex-wrap:wrap}.actions{width:100%}}
</style></head><body><main class="wrap"><div class="top"><div><h1>⚙️ Painel ATACAREJO</h1><p id="me" class="muted"></p></div><button onclick="logout()">Sair</button></div><div class="tabs"><button onclick="show('products')">Produtos</button><button onclick="show('supplier')">Fornecedores</button><button onclick="show('orders')">Pedidos</button></div><section id="products" class="card"><div class="top"><h2>Produtos</h2><button onclick="newProduct()">+ Novo produto</button></div><form id="productForm"><input type="hidden" id="pid"><div class="grid"><div><label>Nome</label><input id="name" required></div><div><label>Categoria</label><input id="category" placeholder="Calçados, Bolsas..."></div><div><label>Tipo</label><select id="type"><option value="varejo">Varejo</option><option value="atacado">Atacado</option></select></div><div><label>Estoque</label><input id="stock" type="number" min="0"></div><div><label>Custo de fábrica</label><input id="cost" type="number" step="0.01"></div><div><label>Preço varejo</label><input id="retail" type="number" step="0.01" placeholder="custo × 1,40"></div><div><label>Preço atacado</label><input id="wholesale" type="number" step="0.01"></div><div><label>Mínimo atacado</label><input id="min" type="number" min="1" value="1"></div><div><label>Fornecedor</label><select id="supplier"><option value="">Meu estoque / sem fornecedor</option></select></div><div><label>Origem do envio</label><select id="origin"><option value="own">Meu estoque</option><option value="supplier">Fornecedor</option></select></div><div><label>Peso (kg)</label><input id="weight" type="number" step="0.001"></div><div><label>Altura (cm)</label><input id="height" type="number" step="0.01"></div><div><label>Largura (cm)</label><input id="width" type="number" step="0.01"></div><div><label>Comprimento (cm)</label><input id="length" type="number" step="0.01"></div></div><label>Fotos (até 8)</label><input id="images" type="file" accept="image/*" multiple><p class="muted">As novas fotos são adicionadas ao produto. No Render gratuito, arquivos locais podem ser perdidos após reinício; depois podemos migrar as fotos para armazenamento permanente.</p><label>Descrição</label><textarea id="description"></textarea><label>Especificações</label><textarea id="specs"></textarea><label>Tamanhos / grade</label><textarea id="sizes"></textarea><label>Cores / modelos</label><textarea id="colors"></textarea><button type="submit">Salvar produto</button></form><div id="productList"></div></section><section id="supplier" class="card hidden"><div class="top"><h2>Fornecedores</h2><button onclick="newSupplier()">+ Novo fornecedor</button></div><form id="supplierForm" class="hidden"><input type="hidden" id="sid"><div class="grid"><div><label>Nome</label><input id="sname"></div><div><label>Empresa</label><input id="company"></div><div><label>CEP de origem</label><input id="scep" placeholder="00000-000"></div><div><label>WhatsApp</label><input id="swhatsapp"></div></div><label>Observações</label><textarea id="snotes"></textarea><button type="submit">Salvar fornecedor</button><button type="button" class="secondary" onclick="cancelSupplier()">Cancelar</button></form><div id="supplierList"></div></section><section id="orders" class="card hidden"><h2>Pedidos</h2><div id="orderList"></div></section></main><script>
const $=id=>document.getElementById(id);async function api(u,o){const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Erro');return j}function show(id){['products','supplier','orders'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='supplier')loadSuppliers();if(id==='orders')loadOrders()}async function boot(){try{const me=await api('/api/me');$('me').textContent='Logado como '+me.email;await loadSuppliers();await loadProducts();await loadOrders()}catch{location.href='/admin-login.html'}}async function logout(){await api('/api/logout',{method:'POST'});location.href='/admin-login.html'}function newProduct(){$('productForm').reset();$('pid').value='';$('min').value=1;window.scrollTo({top:0,behavior:'smooth'})}
$('productForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData();[['name','name'],['category','category'],['type','type'],['cost','factory_cost'],['retail','retail_price'],['wholesale','wholesale_price'],['stock','stock'],['min','wholesale_min'],['supplier','supplier_id'],['origin','shipping_origin'],['weight','weight_kg'],['height','height_cm'],['width','width_cm'],['length','length_cm'],['description','description'],['specs','specifications'],['sizes','sizes'],['colors','colors']].forEach(([a,b])=>fd.append(b,$(a).value));for(const f of $('images').files)fd.append('images',f);try{const id=$('pid').value;await api(id?'/api/products/'+id:'/api/products',{method:id?'PUT':'POST',body:fd});alert('Produto salvo!');newProduct();loadProducts()}catch(err){alert(err.message)}};
async function loadProducts(){const p=await api('/api/admin/products');$('productList').innerHTML=p.map(x=>`<div class="product"><img src="${x.image||''}" alt=""><div class="grow"><b>${x.name}</b><br><span class="tag">${x.type}</span> ${Number(x.retail_price||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})} · estoque ${x.stock}<br><span class="muted">Atacado: ${x.wholesale_price==null?'—':Number(x.wholesale_price).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})} · ${x.images?.length||0} foto(s) · origem ${x.shipping_origin==='supplier'?'fornecedor':'estoque'}</span></div><div class="actions"><button onclick='editProduct(${JSON.stringify(x)})'>Editar</button> <button class="danger" onclick='delProduct(${x.id})'>Excluir</button></div></div>`).join('')||'<p>Nenhum produto.</p>'}
function editProduct(x){$('pid').value=x.id;$('name').value=x.name||'';$('category').value=x.category||'';$('type').value=x.type||'varejo';$('cost').value=x.factory_cost??'';$('retail').value=x.retail_price??'';$('wholesale').value=x.wholesale_price??'';$('stock').value=x.stock??0;$('min').value=x.wholesale_min??1;$('supplier').value=x.supplier_id??'';$('origin').value=x.shipping_origin||'own';$('weight').value=x.weight_kg??'';$('height').value=x.height_cm??'';$('width').value=x.width_cm??'';$('length').value=x.length_cm??'';$('description').value=x.description||'';$('specs').value=x.specifications||'';$('sizes').value=x.sizes||'';$('colors').value=x.colors||'';window.scrollTo({top:0,behavior:'smooth'})}async function delProduct(id){if(confirm('Excluir este produto?')){await api('/api/products/'+id,{method:'DELETE'});loadProducts()}}
function newSupplier(){$('supplierForm').classList.remove('hidden');$('supplierForm').reset();$('sid').value=''}function cancelSupplier(){$('supplierForm').classList.add('hidden')}$('supplierForm').onsubmit=async e=>{e.preventDefault();const b={name:$('sname').value,company_name:$('company').value,cep:$('scep').value,whatsapp:$('swhatsapp').value,notes:$('snotes').value};try{const id=$('sid').value;await api(id?'/api/admin/suppliers/'+id:'/api/admin/suppliers',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});cancelSupplier();loadSuppliers()}catch(err){alert(err.message)}};async function loadSuppliers(){const s=await api('/api/admin/suppliers');$('supplier').innerHTML='<option value="">Meu estoque / sem fornecedor</option>'+s.filter(x=>x.active).map(x=>`<option value="${x.id}">${x.name} • ${x.cep}</option>`).join('');$('supplierList').innerHTML=s.map(x=>`<div class="supplier"><div class="grow"><b>${x.name}</b><br>${x.company_name||''} · CEP ${x.cep}<br><span class="muted">${x.whatsapp||''} ${x.notes?'· '+x.notes:''}</span></div><button onclick='editSupplier(${JSON.stringify(x)})'>Editar</button><button class="danger" onclick='delSupplier(${x.id})'>Desativar</button></div>`).join('')||'<p>Nenhum fornecedor cadastrado.</p>'}function editSupplier(x){$('supplierForm').classList.remove('hidden');$('sid').value=x.id;$('sname').value=x.name;$('company').value=x.company_name||'';$('scep').value=x.cep;$('swhatsapp').value=x.whatsapp||'';$('snotes').value=x.notes||'';show('supplier')}async function delSupplier(id){if(confirm('Desativar este fornecedor?')){await api('/api/admin/suppliers/'+id,{method:'DELETE'});loadSuppliers()}}
async function loadOrders(){try{const os=await api('/api/admin/orders');$('orderList').innerHTML=os.map(o=>`<div class="supplier"><div class="grow"><b>Pedido #${o.id}</b> — ${o.customer_name}</b><br>${o.customer_phone} · ${o.payment_method} · R$ ${Number(o.total).toFixed(2)}<br>Status: <select onchange="changeStatus(${o.id},this.value)"><option ${o.status==='recebido'?'selected':''}>recebido</option><option ${o.status==='confirmado'?'selected':''}>confirmado</option><option ${o.status==='pago'?'selected':''}>pago</option><option ${o.status==='enviado'?'selected':''}>enviado</option><option ${o.status==='concluido'?'selected':''}>concluido</option><option ${o.status==='cancelado'?'selected':''}>cancelado</option></select></div></div>`).join('')||'<p>Nenhum pedido.</p>'}catch(e){$('orderList').textContent=e.message}}async function changeStatus(id,status){await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadOrders()}
boot();
</script></body></html>
