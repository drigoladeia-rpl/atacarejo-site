<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho - ATACAREJO</title><style>body{font-family:Arial;margin:0;background:#f5f5f5}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:5px 0 12px;border:1px solid #ddd;border-radius:8px}button{padding:12px 18px;background:#111;color:#fff;border:0;border-radius:9px;font-weight:bold}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>🛒 Seu carrinho</h1><div id="cart" class="card"></div><div class="card"><h2>Finalizar pedido</h2><div class="grid"><div><input id="name" placeholder="Nome completo"></div><div><input id="phone" placeholder="WhatsApp"></div></div><input id="email" placeholder="E-mail (opcional)"><textarea id="address" placeholder="Endereço para entrega"></textarea><select id="payment"><option value="pix">Pix</option><option value="cartao">Cartão</option><option value="whatsapp">Combinar pelo WhatsApp</option></select><textarea id="notes" placeholder="Observações"></textarea><button onclick="checkout()">Finalizar pedido</button><p id="msg"></p></div></div><script>
let cart=JSON.parse(localStorage.getItem('atacarejo_cart')||'[]');const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function render(){let el=document.getElementById('cart');if(!cart.length){el.innerHTML='<p>Carrinho vazio.</p>';return}el.innerHTML=cart.map((x,i)=>`<div class="row"><div><b>${x.name}</b><br>${money(x.price)} × ${x.quantity}</div><button onclick="removeItem(${i})">Remover</button></div>`).join('')+`<h2>Total: ${money(cart.reduce((a,x)=>a+x.price*x.quantity,0))}</h2>`}function removeItem(i){cart.splice(i,1);save();render()}function save(){localStorage.setItem('atacarejo_cart',JSON.stringify(cart))}async function checkout(){if(!cart.length)return alert('Carrinho vazio');let body={customer:{name:name.value,phone:phone.value,email:email.value,address:address.value},payment_method:payment.value,notes:notes.value,items:cart.map(x=>({product_id:x.id,quantity:x.quantity}))};try{let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.error);localStorage.removeItem('atacarejo_cart');msg.textContent='Pedido #'+j.order.id+' recebido. Total '+money(j.total);cart=[];render()}catch(e){msg.textContent=e.message}}render();</script></body></html>
