<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho • ATACAREJO</title><style>
body{margin:0;font-family:Arial;background:#f7f5f1;color:#151515}header{background:#151515;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}header a{color:#fff;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:30px 5%}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 25px #0000000b}.item{display:flex;gap:14px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.item img{width:76px;height:76px;object-fit:cover;border-radius:12px;background:#eee}.item-info{flex:1}.qty{display:flex;align-items:center;gap:7px}.qty button{border:1px solid #ccc;background:#fff;border-radius:8px;width:32px;height:32px}.remove{border:0;background:none;color:#b00020}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;margin:5px 0 12px}button.primary{width:100%;padding:14px;border:0;border-radius:12px;background:#ef5b3f;color:#fff;font-weight:900}.total{font-size:24px;font-weight:950}.shipment{border:1px solid #ddd;border-radius:12px;padding:13px;margin:10px 0}.note{color:#666;font-size:14px;line-height:1.45}.success{padding:18px;background:#e9f8ef;border-radius:12px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{align-items:flex-start}}
</style></head><body><header><a href="/">← ATACAREJO</a><a href="/carrinho.html">🛒 Carrinho</a></header><main class="wrap"><h1>Seu carrinho</h1><div class="card" id="items"></div><div class="card"><h2>Frete</h2><label>CEP de destino</label><input id="cep" inputmode="numeric" placeholder="00000-000"><button class="primary" onclick="quote()">Calcular frete</button><div id="shipping"></div><p class="note">O sistema separa automaticamente os produtos por origem (estoque próprio ou fornecedor). O preço/prazo real do frete será exibido quando o provedor de frete estiver conectado.</p></div><div class="card"><h2>Dados para finalizar</h2><div class="grid"><div><label>Nome</label><input id="name"></div><div><label>WhatsApp / telefone</label><input id="phone"></div><div><label>E-mail</label><input id="email" type="email"></div><div><label>Forma de pagamento</label><select id="payment"><option value="pix">Pix</option><option value="cartao">Cartão</option><option value="whatsapp">Combinar pelo WhatsApp</option></select></div></div><label>Endereço</label><textarea id="address" placeholder="Rua, número, bairro, cidade, UF"></textarea><label>Observações</label><textarea id="notes"></textarea><div class="total" id="total">Total: R$ 0,00</div><button class="primary" onclick="finish()">Finalizar pedido</button><div id="result"></div></div></main><script>
let cart=JSON.parse(localStorage.getItem('atacarejo_cart')||'[]');let shipping=0;const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const $=id=>document.getElementById(id);function save(){localStorage.setItem('atacarejo_cart',JSON.stringify(cart))}function render(){if(!cart.length){$('items').innerHTML='<p>Seu carrinho está vazio. <a href="/">Voltar à loja</a></p>'}else{$('items').innerHTML=cart.map((x,i)=>`<div class="item"><img src="${x.image||''}" alt=""><div class="item-info"><b>${x.name}</b><br>${money(x.unit_price)} cada</div><div class="qty"><button onclick="change(${i},-1)">−</button><b>${x.quantity}</b><button onclick="change(${i},1)">+</button></div><button class="remove" onclick="removeItem(${i})">Excluir</button></div>`).join('')}updateTotal()}function change(i,d){cart[i].quantity=Math.max(1,cart[i].quantity+d);save();render()}function removeItem(i){cart.splice(i,1);save();render()}async function quote(){if(!cart.length)return alert('Carrinho vazio.');try{const r=await fetch('/api/shipping/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({destination_cep:$('cep').value,items:cart})});const j=await r.json();if(!r.ok)throw Error(j.error);shipping=Number(j.total||0);$('shipping').innerHTML=(j.shipments||[]).map(s=>`<div class="shipment"><b>${s.origin_name}</b><br>Origem: ${s.origin_cep}<br>Peso estimado: ${Number(s.total_weight||0).toFixed(3)} kg</div>`).join('')+`<p class="note">${j.note||''}</p>`;updateTotal()}catch(e){alert(e.message)}}function updateTotal(){const subtotal=cart.reduce((a,x)=>a+Number(x.unit_price||0)*Number(x.quantity||1),0);$('total').textContent='Total: '+money(subtotal+shipping)+' (produtos '+money(subtotal)+' + frete '+money(shipping)+')'}async function finish(){if(!cart.length)return alert('Carrinho vazio.');if(!$('name').value||!$('phone').value)return alert('Preencha nome e telefone.');try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:{name:$('name').value,phone:$('phone').value,email:$('email').value,address:$('address').value},items:cart,payment_method:$('payment').value,notes:$('notes').value,shipping_total:shipping})});const j=await r.json();if(!r.ok)throw Error(j.error);localStorage.removeItem('atacarejo_cart');cart=[];render();$('result').innerHTML=`<div class="success"><b>Pedido #${j.order.id} recebido!</b><br>Total: ${money(j.total)}<br>Você pode aguardar o contato da equipe para confirmar pagamento e envio.</div>`}catch(e){alert(e.message)}}render();
</script></body></html>
