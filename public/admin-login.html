<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração • ATACAREJO</title><style>
body{font-family:Arial;margin:0;background:#f5f3ef;color:#151515}.wrap{max-width:520px;margin:8vh auto;padding:20px}.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 10px 30px #0001}h1{margin-top:0}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px}input{border:1px solid #ddd}button{border:0;background:#151515;color:#fff;font-weight:800;cursor:pointer}.msg{color:#b00020;min-height:20px}
</style></head><body><div class="wrap"><div class="card"><h1>⚙️ Painel ATACAREJO</h1><p>Área exclusiva de administração.</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button onclick="login()">Entrar</button><div id="msg" class="msg"></div></div></div><script>
async function login(){const msg=document.getElementById('msg');msg.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Erro no login');location.href='/admin.html'}catch(e){msg.textContent=e.message}}
</script></body></html>
